<div class="page-wrapper">

  <div class="container-fluid">

    <!-- Header -->
    <div class="row align-items-center mb-4">

      <div class="col-md-8">
        <h2 class="fw-bold page-title mb-1">Attendance</h2>
        <small class="page-subtitle">
          Browse Attendance Records
        </small>
      </div>

      <div class="col-md-4 text-md-end mt-3 mt-md-0">
        <button class="btn custom-btn text-white px-4">
          Attendance Report
        </button>
      </div>

    </div>

    <!-- Filtertion -->
   <div class="card custom-card mb-4">
  <div class="card-body">

    <div class="row g-3 align-items-end">

      <!-- Search -->
      <div class="col-xl-3 col-lg-6 col-md-6">
        <label class="form-label">Search By Name</label>

        <div class="position-relative">
          <input
            type="text"
            class="form-control search-input"
            placeholder="Enter employee name..."
          />

          <i class="bi bi-search search-icon"></i>
        </div>
      </div>

      <!-- Attendance Type -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label class="form-label">Attendance Type</label>

        <select class="form-select">
          <option>Presence</option>
          <option>Departure</option>
        </select>
      </div>

      <!-- Year -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label class="form-label">Year</label>

        <select class="form-select">
          <option>2024</option>
          <option>2025</option>
          <option>2026</option>
        </select>
      </div>

      <!-- Month -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label class="form-label">Month</label>

        <select class="form-select">
          <option>January</option>
          <option>February</option>
          <option>March</option>
        </select>
      </div>

      <!-- Day -->
      <div class="col-xl-1 col-lg-3 col-md-6">
        <label class="form-label">Day</label>

        <select class="form-select">
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select>
      </div>

      <!-- Buttons -->
      <div class="col-xl-2 col-lg-6 col-md-12">

        <div class="d-flex gap-2 filter-actions">

          <button class="btn filter-btn flex-fill">
            <i class="bi bi-funnel me-1"></i>
            Filter
          </button>

          <button class="btn reset-btn flex-fill">
            <i class="bi bi-arrow-clockwise me-1"></i>
            Reset
          </button>

        </div>

      </div>

    </div>

  </div>
</div>

    <!-- Table -->
    <div class="card custom-card">

      <div class="card-body">

        <div class="table-responsive">

          <table class="table attendance-table align-middle">

            <thead class="table-light rounded-3"> 
              <tr class="text-center shadow-md ">
                <th>Employee Id</th>
                <th>Name</th>
                <th>Year</th>
                <th>Month</th>
                <th>Day</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Attendance</th>
              </tr>
            </thead>

            <tbody>

              @for (item of data; track $index) {

              <tr class="text-center">
                <td class="emp-uniqe">
                  <span class="serial-pill">
                 {{item.id}}   
                  </span>
                </td>

                <td>{{item.name}}</td>

                <td>
                  <span class="year-pill">
                    {{item.Year}}
                  </span>
                </td>

                <td>{{item.Month}}</td>
                <td>{{item.Day}}</td>
                <td>{{item.checkIn}}</td>
                <td>{{item.checkOut}}</td>
                <td>{{item.attendance}}</td>
              </tr>

              }

            </tbody>

          </table>

        </div>

        <!-- Pagination -->

        <div class="pagination-wrapper">

              <ul class="pagination mb-0">

                <li class="page-item">
                  <a class="page-link">1</a>
                </li>

                <li class="page-item activee">
                  <a class="page-link">2</a>
                </li>

                <li class="page-item">
                  <a class="page-link">...</a>
                </li>

                <li class="page-item">
                  <a class="page-link">8</a>
                </li>

                <li class="page-item">
                  <a class="page-link next-btn">
                    →
                  </a>
                </li>

          </ul>

        </div>

      </div>

    </div>

  </div>

</div>
